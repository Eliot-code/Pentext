name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # ── Run pytest test suite ────────────────────────────────────────────────────
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ── Syntax-check all module source files ─────────────────────────────────────
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all modules/*.py files
        run: |
          python - <<'EOF'
          import sys, os, glob, py_compile

          failures = []
          for path in sorted(glob.glob("modules/*.py")):
              try:
                  py_compile.compile(path, doraise=True)
                  print(f"  OK  {path}")
              except py_compile.PyCompileError as exc:
                  print(f"  FAIL {path}: {exc}", file=sys.stderr)
                  failures.append(path)

          if failures:
              print(f"\n{len(failures)} file(s) failed syntax check:", file=sys.stderr)
              for f in failures:
                  print(f"  {f}", file=sys.stderr)
              sys.exit(1)

          print(f"\nAll {len(glob.glob('modules/*.py'))} module(s) passed syntax check.")
          EOF
